<!doctype html>
<!-- Dev-only test page for POST /api/recordings. Not the real frontend. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recording test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 16px; }
    button { font-size: 1rem; padding: .5rem 1rem; margin-right: .5rem; }
    pre { background: #f2f2f2; padding: 1rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Recording test</h1>
  <p>Record from your mic, or pick an audio file, then upload it to <code>POST /api/recordings</code>.</p>

  <button id="start">Start recording</button>
  <button id="stop" disabled>Stop</button>
  <span id="timer"></span>
  <p><input type="file" id="file" accept="audio/*"></p>
  <audio id="player" controls hidden></audio>
  <p><button id="upload" disabled>Upload</button><button id="transcribe" disabled>Transcribe</button><button id="analyse" disabled>Analyse</button></p>
  <pre id="out">No upload yet.</pre>

  <script>
    const $ = (id) => document.getElementById(id);
    let recorder, chunks = [], blob, startedAt, tick, recordingId;

    function setBlob(b) {
      blob = b;
      $('player').src = URL.createObjectURL(b);
      $('player').hidden = false;
      $('upload').disabled = false;
    }

    $('start').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          clearInterval(tick);
          setBlob(new Blob(chunks, { type: recorder.mimeType }));
        };
        recorder.start();
        startedAt = Date.now();
        tick = setInterval(() => ($('timer').textContent = Math.round((Date.now() - startedAt) / 1000) + 's'), 250);
        $('start').disabled = true;
        $('stop').disabled = false;
      } catch (err) {
        $('out').textContent = 'Microphone error: ' + err.message;
      }
    };

    $('stop').onclick = () => {
      recorder.stop();
      $('start').disabled = false;
      $('stop').disabled = true;
    };

    $('file').onchange = (e) => e.target.files[0] && setBlob(e.target.files[0]);

    // Same flow the real frontend should use: get a link, upload straight to Cloud Storage, then complete
    $('upload').onclick = async () => {
      const show = (step, res, data) => ($('out').textContent = `${step}: ${res.status}\n` + JSON.stringify(data, null, 2));
      const fileName = blob.name || 'recording';
      const started = Date.now();

      $('out').textContent = '1/3 Getting upload link…';
      let res = await fetch('/api/recordings/upload-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contentType: blob.type, fileName, sizeBytes: blob.size }),
      });
      let data = await res.json();
      if (!res.ok) return show('upload-url', res, data);

      $('out').textContent = `2/3 Uploading ${(blob.size / 1024 / 1024).toFixed(1)} MB to Cloud Storage…`;
      const put = await fetch(data.uploadUrl, { method: data.method, headers: data.headers, body: blob });
      if (!put.ok) return ($('out').textContent = `Cloud Storage upload: ${put.status}\n` + (await put.text()));

      $('out').textContent = '3/3 Checking the file…';
      res = await fetch(`/api/recordings/${data.id}/complete`, { method: 'POST' });
      data = await res.json();
      show(`complete (${((Date.now() - started) / 1000).toFixed(1)}s total)`, res, data);
      recordingId = res.ok && data.id;
      $('transcribe').disabled = $('analyse').disabled = !recordingId;
    };

    $('analyse').onclick = async () => {
      $('out').textContent = 'Analysing… (transcribes first if needed)';
      const started = Date.now();
      const res = await fetch(`/api/recordings/${recordingId}/analysis`, { method: 'POST' });
      const secs = ((Date.now() - started) / 1000).toFixed(1);
      $('out').textContent = `${res.status} in ${secs}s\n` + JSON.stringify(await res.json(), null, 2);
    };

    $('transcribe').onclick = async () => {
      $('out').textContent = 'Transcribing…';
      const started = Date.now();
      const res = await fetch(`/api/recordings/${recordingId}/transcript`, { method: 'POST' });
      const secs = ((Date.now() - started) / 1000).toFixed(1);
      $('out').textContent = `${res.status} in ${secs}s\n` + JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
