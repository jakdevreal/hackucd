<!doctype html>
<!-- Dev-only test page for POST /api/recordings. Not the real frontend. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recording test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 16px; }
    button { font-size: 1rem; padding: .5rem 1rem; margin-right: .5rem; }
    pre { background: #f2f2f2; padding: 1rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Recording test</h1>
  <p>Record from your mic, or pick an audio file, then upload it to <code>POST /api/recordings</code>.</p>

  <button id="start">Start recording</button>
  <button id="stop" disabled>Stop</button>
  <span id="timer"></span>
  <p><input type="file" id="file" accept="audio/*"></p>
  <audio id="player" controls hidden></audio>
  <p><button id="upload" disabled>Upload</button></p>
  <pre id="out">No upload yet.</pre>

  <script>
    const $ = (id) => document.getElementById(id);
    let recorder, chunks = [], blob, startedAt, tick;

    function setBlob(b) {
      blob = b;
      $('player').src = URL.createObjectURL(b);
      $('player').hidden = false;
      $('upload').disabled = false;
    }

    $('start').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          clearInterval(tick);
          setBlob(new Blob(chunks, { type: recorder.mimeType }));
        };
        recorder.start();
        startedAt = Date.now();
        tick = setInterval(() => ($('timer').textContent = Math.round((Date.now() - startedAt) / 1000) + 's'), 250);
        $('start').disabled = true;
        $('stop').disabled = false;
      } catch (err) {
        $('out').textContent = 'Microphone error: ' + err.message;
      }
    };

    $('stop').onclick = () => {
      recorder.stop();
      $('start').disabled = false;
      $('stop').disabled = true;
    };

    $('file').onchange = (e) => e.target.files[0] && setBlob(e.target.files[0]);

    $('upload').onclick = async () => {
      const form = new FormData();
      const ext = { 'audio/webm': 'webm', 'audio/ogg': 'ogg', 'audio/mp4': 'm4a' }[blob.type.split(';')[0]] || 'audio';
      form.append('audio', blob, blob.name || 'recording.' + ext);
      $('out').textContent = 'Uploading…';
      const res = await fetch('/api/recordings', { method: 'POST', body: form });
      $('out').textContent = res.status + '\n' + JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
